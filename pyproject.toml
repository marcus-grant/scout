[project]
name = "scout"
version = "0.0.1"
description = "SQLite manifests of file trees, keyed on content hash"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "attrs",
    "b3c32",
    "click",
]

[project.scripts]
scout = "cli:main"

[dependency-groups]
dev = [
    "pyfakefs",
    "pyright",
    "pytest",
    "pytest-mock",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "lib"]

[tool.ruff]
line-length = 88

[tool.pyright]
include = ["cli", "lib", "test"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["salvage", ".venv"]
markers = ["e2e: end-to-end tests through the CLI and DB file"]